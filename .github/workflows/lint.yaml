name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Disable permissions for all available scopes
permissions: {}

jobs:
  trunk-code-quality:
    name: Trunk Code Quality
    permissions:
      actions: write # Allow trunk to access the actions cache
      checks: write # Allow trunk to post annotations
      contents: read # Required to checkout the repository
    runs-on: ubuntu-slim
    concurrency:
      group: trunk-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Code Quality
        uses: trunk-io/trunk-action@v2.0.0
        with:
          # Run 'trunk check --all' on linter upgrades to verify updates do not
          # produce errors
          arguments: ${{ github.head_ref == 'trunk-io/update-trunk' && '--all' || '' }}
