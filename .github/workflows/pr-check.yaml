name: PR Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

# Disable permissions for all available scopes
permissions: {}

jobs:
  pr-title-check:
    name: Validate PR Title
    permissions:
      contents: read
      pull-requests: write # Required to add comments on PRs
    runs-on: ubuntu-latest # Uses Docker container; cannot use ubuntu-slim
    timeout-minutes: 5
    concurrency:
      group: pr-title-${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    env:
      # Re-run checks when the PR title is corrected, except on renovate PRs
      RERUN_CHECKS: ${{ github.event.action == 'edited' && github.event.changes.title.from != null && github.event.pull_request.user.login != 'renovate[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate PR title conforms to conventional spec
        id: validate-pr-title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # cspell:disable-next-line
        uses: amannn/action-semantic-pull-request@v6.1.1
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            refactor
            revert
          requireScope: true
          scopes: |
            actions
            deps
            plugin
            release
            renovate
            trunk
          # Deny characters &, <, and > in the subject line to ensure proper formatting
          # https://docs.slack.dev/messaging/formatting-message-text/#escaping
          subjectPattern: ^[^&<>]+$
          subjectPatternError: |
            Subject line must not contain the characters &, <, or >.

      - name: Add PR comment on failure
        # Only add a comment if the error message is not null.
        if: ${{ always() && steps.validate-pr-title.outputs.error_message != null }}
        id: pr-comment
        # cspell:disable-next-line
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-error
          message: |
            ### Invalid PR Title

            ${{ steps.validate-pr-title.outputs.error_message }}

            Please update the title accordingly; checks will re-run automatically.

      - name: Delete PR comment on resolution
        # Delete comment, if it exists, when the PR title is valid.
        if: ${{ steps.validate-pr-title.outputs.error_message == null }}
        id: delete-comment
        # cspell:disable-next-line
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: pr-title-error
          delete: true

      # Workflow triggered by GITHUB_TOKEN require manual approval
      # Use threeware-bot application token for re-run checks to remove this dependency
      - name: Get GitHub App token
        if: env.RERUN_CHECKS == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.THREEWARE_RELEASE_APPLICATION_ID }}
          private-key: ${{ secrets.THREEWARE_RELEASE_APPLICATION_PRIVATE_KEY }}
          permission-contents: write # Required to push commit to re-run checks

      - name: Re-run Checks
        if: env.RERUN_CHECKS == 'true'
        # cspell:disable-next-line
        uses: planetscale/ghcommit-action@v0.2.22
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          commit_message: "re-run checks after PR title correction"
          empty: true

  enforce-all-checks:
    name: Status Checks
    # Run on every event except PR title edits
    # validate-pr-title will re-run checks after title corrections
    # Ensures this required check runs when release-please edits the PR body
    if: github.event.changes.title.from == null
    permissions:
      checks: read # Required to read the status of checks on the PR
    runs-on: ubuntu-latest # Requires timeout longer than 15 minutes; cannot use ubuntu-slim
    timeout-minutes: 30
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      # bots often trigger edited and synchronize events close together, so this
      # job should not be cancelled if it is already running
      cancel-in-progress: false
    steps:
      - name: GitHub Checks
        uses: poseidon/wait-for-status-checks@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The Checks API returns display names here, not workflow-qualified job names.
          ignore_pattern: ^(Status Checks|Approve PR)$

  auto-approve-pr:
    needs: enforce-all-checks
    # auto-approve should only run on PRs created by bots and not on release-please branches
    if: >-
      github.event.action != 'edited'
      && contains(fromJSON('["renovate[bot]", "3ware[bot]"]'), github.event.pull_request.user.login)
      && github.event.pull_request.head.ref != 'release-please--branches--main'
    name: Approve PR
    permissions:
      contents: write # Required to enable auto-merge
      pull-requests: write # Required to approve the PR
    runs-on: ubuntu-slim
    timeout-minutes: 10
    concurrency:
      group: auto-approve-${{ github.workflow }}-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Auto approve
        # Workaround for auto-approve-action#42: the action exits 1 when it declines to approve
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'review-required') }}
        # cspell:disable-next-line
        uses: lekman/auto-approve-action@v1
        with:
          allowed-authors: 3ware[bot], renovate[bot]
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-files-changed: "5"
          merge-method: squash
          path-filters: .github/gh-actions-lock.version,.github/workflows/**
          required-labels: auto-merge
